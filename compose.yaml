services:
  ministack:
    image: ministackorg/ministack:1.5.41
    environment:
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${SQS_PORT:-4566}:4566"
    volumes:
      - ./docker/ministack/ready.d:/docker-entrypoint-initaws.d/ready.d:ro
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jungle}
      POSTGRES_USER: ${POSTGRES_USER:-jungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jungle_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
